name: aegis_app
description: Project Aegis - A next-generation AI-powered encrypted digital brain application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core Offline & Encryption
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  encrypt: ^5.0.1
  flutter_secure_storage: ^8.0.0
  local_auth: ^2.1.6 # Biometric authentication

  # State Management & Network
  provider: ^6.0.5
  dio: ^5.3.2

  # UI / UX Design enhancements
  google_fonts: ^6.1.0
  glassmorphism: ^3.0.0 # For rich aesthetics and dynamic designs
  lottie: ^2.6.0 # For micro-animations

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
